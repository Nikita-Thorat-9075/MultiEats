<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Main Admin Panel · MultiEats</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="wrap" id="panel" style="display:none"><h2 style="margin-top:0">Main Admin / Restaurant Panel</h2><div class="muted">System-wide monitoring only</div><div class="tabs" id="tabs"></div><div id="c"></div></div><script src="js/config.js"></script><script src="js/common.js"></script><script>
const ALLOWED=isAdmin();if(!ALLOWED)location.replace(getUser()?'index.html':'login.html?next=admin.html');else{$('#panel').style.display='';nav('admin')}
const T={dash:'📊 Dashboard',cust:'👥 Customer Activity',rest:'🍴 Restaurant Activity'},sc={pending:'y',preparing:'b',ready:'b',delivered:'g',cancelled:'r',completed:'g',confirmed:'y',assigned:'g',picked_up:'b'};
const pill=s=>s?`<span class="pill ${sc[s]||''}">${esc(String(s).replace('_',' '))}</span>`:'<span class="muted">—</span>';const dt=d=>d?new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';const wrap=h=>`<div class="card tbl-wrap">${h}</div>`;let CUR='dash';
function tab(k){CUR=k;$('#tabs').innerHTML=Object.entries(T).map(([a,b])=>`<button class="${a===k?'on':''}" onclick="tab('${a}')">${b}</button>`).join('');Promise.resolve(V[k]()).catch(e=>$('#c').innerHTML=`<div class="alert bad">${esc(e.message)}</div>`)}
const V={
async dash(){const d=await api('/platform/dashboard'),card=(t,v)=>`<div class="card"><span class="muted">${t}</span><b>${v}</b></div>`;$('#c').innerHTML=`<div class="stat wide">${card('Restaurants',d.restaurants)}${card('Customers',d.customers)}${card('Restaurant owners',d.restaurant_owners)}${card('Orders',d.orders)}${card('Active orders',d.active_orders)}${card('Deliveries assigned',d.deliveries_assigned)}${card('Waiting for delivery partner',d.deliveries_waiting)}</div><div class="card pad"><h3 style="margin-top:0">Main Admin</h3><p class="muted">Monitor customers, restaurants, orders and the single-delivery assignment across the entire MultiEats system. Customer shopping pages are intentionally not shown.</p></div>`},
async cust(){const rows=await api('/platform/customer-activity');$('#c').innerHTML=wrap(`<table><tr><th>Order</th><th>Date / time</th><th>Customer</th><th>Delivery address</th><th>Restaurants</th><th>Items / quantity</th><th>Order status</th><th>Delivery</th></tr>${rows.map(x=>`<tr><td>#${x.order_id}</td><td>${dt(x.created_at)}</td><td>${esc(x.customer)}<div class="muted">${esc(x.customer_email||'')}</div></td><td>${esc(x.delivery_address||'—')}</td><td>${esc(x.restaurants)}</td><td>${esc(x.items)}</td><td>${pill(x.overall_status)}</td><td>${x.delivery_partner?`<b>${esc(x.delivery_partner)}</b><br>${pill(x.delivery_status)}`:esc(x.delivery_assignment_status)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No customer activity</td></tr>'}</table>`)},
async rest(){const rows=await api('/platform/restaurant-activity');$('#c').innerHTML=wrap(`<table><tr><th>Restaurant</th><th>Order</th><th>Customer</th><th>Items</th><th>Order time</th><th>Sub-order status</th><th>Accepted / rejected</th><th>Delivery</th></tr>${rows.map(x=>`<tr><td>${esc(x.restaurant)}</td><td>#${x.order_id}<div class="muted">Sub-order #${x.sub_order_id}</div></td><td>${esc(x.customer)}</td><td>${esc(x.items)}</td><td>${dt(x.created_at)}</td><td>${pill(x.sub_status)}</td><td>${x.sub_status==='cancelled'?'Rejected / cancelled':x.sub_status==='pending'?'Pending':'Accepted / processing'}</td><td>${x.delivery_partner?`<b>${esc(x.delivery_partner)}</b><br>${pill(x.delivery_status)}`:esc(x.delivery_assignment_status)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No restaurant activity</td></tr>'}</table>`)}}
if(ALLOWED)tab('dash');</script></body></html>
